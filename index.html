<style>
  :root { --green:#0F3B2C; --crimson:#A51C30; --white:#FAF9F6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--white); color:var(--green); display:flex; flex-direction:column; min-height:100vh; padding:28px 32px; }
  .top, .bot { display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; opacity:.65; gap:16px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 0; }
  main svg { width:clamp(72px, 12vw, 120px); height:auto; margin-bottom:34px; }
  h1 { font-family:'Libre Baskerville', Georgia, serif; font-weight:400; font-size:clamp(26px, 5vw, 52px); letter-spacing:.24em; margin-right:-.24em; }
  .tag { font-family:'Instrument Serif', Georgia, serif; font-style:italic; font-size:clamp(19px, 2.4vw, 26px); color:var(--crimson); margin-top:16px; }
  a.cta { margin-top:44px; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--green); text-decoration:none; border:1px solid var(--green); padding:14px 22px; transition:background .2s, color .2s; }
  a.cta:hover { background:var(--green); color:var(--white); }
  @media (max-width:560px) { .top span:last-child, .bot span:last-child { display:none; } }
</style>
</head>
