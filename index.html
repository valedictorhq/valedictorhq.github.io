<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valedictor · Ask the people who know.</title>
<meta name="description" content="Valedictor. Book short sessions with verified students, alumni and faculty from the world's top schools. Ask the people who know.">
<meta name="theme-color" content="#121317">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#121317; --paper:#F6F3EC; --blue:#2B59FF; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:'Outfit', system-ui, sans-serif; display:flex; flex-direction:column; min-height:100vh; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:64px 24px; }
  .logo { width:min(560px, 82vw); height:auto; display:block; }
  .line { font-size:clamp(20px, 2.6vw, 28px); margin-top:clamp(18px, 2.4vw, 28px); opacity:.75; }
  .who { font-size:16px; margin-top:14px; opacity:.55; }
  a.cta { margin-top:40px; display:inline-block; background:var(--blue); color:#fff; text-decoration:none; font-weight:700; font-size:17px; padding:16px 26px; border-radius:14px; box-shadow:0 10px 24px rgba(43,89,255,.25); transition:transform .15s, box-shadow .15s; }
  a.cta:hover { transform:translateY(-1px); box-shadow:0 14px 30px rgba(43,89,255,.32); }
  footer { display:flex; justify-content:space-between; gap:16px; padding:24px 28px; font-size:14px; opacity:.5; }
  @media (max-width:520px) { footer { flex-direction:column; align-items:center; text-align:center; } }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="valedictor">
    <p class="line">Ask the people who know.</p>
    <p class="who">Students, alumni and faculty of the world's top schools. From 15 minutes to 2 hours.</p>
    <!-- swap to hello@valedictor.com once domain email is set up -->
    <a class="cta" href="mailto:valedictor2026@gmail.com?subject=Early%20access">Get early access</a>
  </main>
  <footer><span>Boston</span><span>valedictor.com</span></footer>
</body>
</html>
